# client/docs/TESTFLIGHT.md: TestFlight build, started by hand only.
# Runs the app CI gates, then builds for TestFlight. Inspect the finished build
# before dispatching testflight-submit.yml with its exact EAS build ID.
# EAS supplies the build env (its `preview` environment) and iOS signing;
# the only secret here is EXPO_TOKEN (repo Settings → Secrets → Actions).
#
# Starting this workflow IS a release action — only run it with Justin's
# explicit go-ahead for that commit. It does not tag, push migrations, publish
# OTA updates, or release to the App Store.
name: TestFlight build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Main branch, or a commit SHA already merged into main
        required: true
        default: main
      message:
        description: Short note shown on the EAS build (e.g. "Build 5 — fixes #50–#55")
        required: false
        default: ''

# One TestFlight release action at a time; never cancel one mid-flight.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Gates · EAS build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: client
    steps:
      - name: Verify dispatch branch
        working-directory: .
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != 'refs/heads/main' ]; then
            echo "::error::Dispatch the TestFlight workflow from main."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ref is merged into main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The release ref must be merged into main."
            exit 1
          fi

      - name: Check EXPO_TOKEN is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the EXPO_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # toodaloo has no lint script; tsc + Jest are the gates (same as ci.yml).
      - run: npm test -- --ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.7.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          sha=$(git rev-parse HEAD)
          msg="${MESSAGE:-TestFlight from ${sha:0:7}}"
          eas build --platform ios --profile testflight \
            --non-interactive --wait --json \
            --message "$msg" > build.json

      - name: Release record
        if: always()
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          {
            echo "### TestFlight run"
            echo ""
            sha=$(git rev-parse HEAD 2>/dev/null || true)
            echo "- Source commit: \`${sha:-unavailable}\` (input \`$REQUESTED_REF\`)"
            if [ -s build.json ]; then
              jq -r '.[] | "- EAS build: `\(.id)` · \(.status) · \(.appVersion) (\(.appBuildVersion)) · channel `\(.channel // "?")` · commit `\(.gitCommitHash)`"' build.json || true
            else
              echo "- EAS build: not started"
            fi
            echo ""
            echo "Next (client/docs/TESTFLIGHT.md): inspect the finished build's signing, version,"
            echo "env vars (preview), channel (preview); then dispatch TestFlight submit with this build ID."
          } >> "$GITHUB_STEP_SUMMARY"
